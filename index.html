<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sideindividuelle SEO-tagger (title, description, og:title, og:url, og:image osv.) settes av react-helmet-async per side -->
    <title>Babysvømming Asker | Idrettsbarna | Svømmekurs Risenga</title>
    <link rel="icon" type="image/jpeg" href="/logo-fish.jpg" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <!-- Globale OG-tagger som er identiske på alle sider -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Idrettsbarna – Lær å svømme" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Outfit (brødtekst) + Fraunces (overskrifter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics, Google Ads og Meta-pikselen lå her som faste
         skript. De lastet ved hver sidelasting, før noen hadde sagt ja.
         Etter ekomloven krever slike informasjonskapsler samtykke først.

         De lastes nå fra utils/samtykke.ts, og bare når noen har trykket
         ja i samtykkebanneret. Se components/SamtykkeBanner.tsx. -->

    <!-- End Meta Pixel Code -->

    <!-- importmap fjernet – React er bundlet av Vite i /assets/index-*.js -->
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body
    class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white"
  >
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=275364239776475&ev=PageView&noscript=1"
    /></noscript>
    <div id="root">
      <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">
        Idrettsbarna - Babysvømming og Svømmekurs i Asker
      </h1>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
